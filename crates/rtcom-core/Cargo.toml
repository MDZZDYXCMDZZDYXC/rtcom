[package]
name = "rtcom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library for rtcom (Rust Terminal Communication): serial device abstraction, event bus, and session orchestration."
readme = "../../README.md"
keywords = ["serial", "terminal", "uart", "embedded", "async"]
categories = ["asynchronous", "embedded", "hardware-support"]

[lints]
workspace = true

[features]
default = ["udev"]
# Pulls in `libudev` (glibc Linux only) for USB-aware port enumeration.
# Disable with `--no-default-features` on minimal targets such as ARMv7
# appliances or static musl builds where libudev is unavailable: opening a
# device by path still works, and port enumeration falls back to scanning
# `/sys/class/tty` (no USB metadata).
udev = ["serialport/libudev", "tokio-serial/libudev"]

[dependencies]
bytes = { workspace = true }
serialport = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-serial = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
